    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:var(--sans)}body{background:radial-gradient(circle at 92% 4%,rgba(202,168,94,.15),transparent 28%),linear-gradient(140deg,#f8f3e9,#f2e7d6)}
    .page{min-height:100vh;padding:20px 22px 110px}.desktop .page{max-width:1320px;margin:auto;padding:28px 34px 56px}.appbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:38px;height:38px;border-radius:50%;background:#0d0d0c;display:grid;place-items:center;color:var(--gold2);font-family:var(--serif);font-size:22px;border:1px solid var(--gold)}.brandcopy b{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:.04em}.brandcopy span{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,250,241,.8);display:grid;place-items:center;font-size:18px}.hero{position:relative;overflow:hidden;min-height:215px;border-radius:28px;background:linear-gradient(135deg,#1b1211 0%,#3b1219 45%,#671a2b 100%);color:white;padding:25px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-88px;top:-95px;border:1px solid rgba(230,204,138,.25);box-shadow:0 0 0 28px rgba(230,204,138,.035),0 0 0 56px rgba(230,204,138,.025)}.hero:after{content:"✦";position:absolute;right:31px;top:23px;color:var(--gold2);font-size:18px}.kicker{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}h1,h2,h3,p{margin-top:0}.hero h1{font-family:var(--serif);font-size:38px;line-height:1.03;font-weight:400;margin:9px 0 8px;max-width:520px}.hero p{font-size:13px;line-height:1.55;opacity:.78;margin:0;max-width:520px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:27px 0 13px}.sectionhead h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}.sectionhead a{font-size:12px;color:var(--wine);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.category{min-height:170px;border-radius:21px;overflow:hidden;position:relative;background:#222;box-shadow:0 10px 24px rgba(52,31,18,.12)}.category img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.category:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(12,8,7,.85))}.category .label{position:absolute;z-index:1;left:15px;right:12px;bottom:13px;color:white}.category .label b{font-family:var(--serif);font-size:19px;font-weight:400}.category .label span{display:block;font-size:10px;opacity:.68;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:9px 13px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}.pill.active{background:var(--wine);color:white;border-color:var(--wine)}.chips{display:flex;gap:8px;overflow:hidden;margin:17px 0}.card{background:rgba(255,250,241,.93);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(60,36,22,.055)}.pad{padding:18px}.btn{border:0;border-radius:999px;background:var(--wine);color:white;padding:13px 18px;font-family:var(--sans);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.gold{background:var(--gold);color:#24190b}.btn.light{background:var(--paper);color:var(--wine);border:1px solid var(--line)}.btn.full{width:100%}.sticky{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:13px 20px 18px;background:rgba(246,240,228,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(221,210,191,.8)}.sticky .btn{width:100%;max-width:970px;margin:auto;display:flex}.search{height:48px;border:1px solid var(--line);border-radius:999px;background:var(--paper);display:flex;align-items:center;padding:0 17px;gap:10px;color:var(--muted);font-size:13px}.dishlist{display:grid;gap:12px}.dish{display:grid;grid-template-columns:116px 1fr;overflow:hidden;min-height:118px}.dish img{width:100%;height:100%;object-fit:cover}.dish .info{padding:14px}.dish h3{font-family:var(--serif);font-weight:400;font-size:19px;margin-bottom:5px}.dish p{font-size:11px;color:var(--muted);line-height:1.45;margin:0 0 9px}.price{font-weight:700;color:var(--wine);font-size:13px}.detailphoto{height:315px;border-radius:27px;overflow:hidden;position:relative;background:#211}.detailphoto img{width:100%;height:100%;object-fit:cover}.detailphoto:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,8,6,.55))}.floatback{position:absolute;z-index:2;top:15px;left:15px;width:40px;height:40px;border-radius:50%;background:rgba(255,250,241,.9);display:grid;place-items:center}.floating-heart{position:absolute;z-index:2;top:15px;right:15px;width:40px;height:40px;border-radius:50%;background:rgba(255,250,241,.9);display:grid;place-items:center}.titleline{display:flex;justify-content:space-between;align-items:start;gap:12px;margin:20px 1px 10px}.titleline h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0}.copy{font-size:13px;line-height:1.6;color:var(--muted)}.notice{border-radius:17px;padding:13px 15px;background:#f3e7cb;border:1px solid #dfc58a;color:#604b20;font-size:12px}.options{display:grid;gap:9px}.option{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--paper);border-radius:15px;padding:13px 14px;font-size:12px}.option.on{border-color:var(--wine);background:#f8e8e8}.check{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}.on .check{background:var(--wine);color:white;border-color:var(--wine)}.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:11px}.line{height:1px;background:var(--line);margin:14px 0}.qty{display:flex;align-items:center;gap:17px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:700}.qty i{font-style:normal;color:var(--wine);font-size:18px}.cartitem{display:grid;grid-template-columns:82px 1fr;gap:13px}.cartitem img{width:82px;height:82px;object-fit:cover;border-radius:15px}.cartitem h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:2px 0 4px}.totals{font-size:12px;display:grid;gap:10px}.totals .grand{font-size:16px;font-weight:700;padding-top:12px;border-top:1px solid var(--line)}.statusrail{display:flex;justify-content:space-between;position:relative;margin:15px 0 8px}.statusrail:before{content:"";position:absolute;left:16px;right:16px;top:12px;height:2px;background:var(--line)}.statusrail span{position:relative;z-index:1;width:25px;height:25px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}.statusrail span.done{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 5px white}.emblem{width:76px;height:76px;margin:8px auto 16px;border-radius:50%;display:grid;place-items:center;background:#e2efe7;color:var(--green);border:1px solid #b7d4c2;font-size:31px}.center{text-align:center}.center h1{font-family:var(--serif);font-size:34px;font-weight:400;margin-bottom:8px}.navdock{position:fixed;z-index:30;left:14px;right:14px;bottom:12px;height:68px;background:#1b1412;color:white;border-radius:24px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 18px 40px rgba(23,20,18,.25)}.navdock div{font-size:9px;text-align:center;opacity:.65}.navdock div.active{color:var(--gold2);opacity:1}.navdock b{display:block;font-size:19px;margin-bottom:2px}.qrbox{height:190px;border-radius:25px;background:#1a1312;color:white;display:grid;grid-template-columns:1fr 130px;align-items:center;padding:24px;overflow:hidden;position:relative}.qr{width:112px;height:112px;background:repeating-conic-gradient(#16110f 0 25%,#fff 0 50%) 50%/18px 18px;border:8px solid white;border-radius:12px}.eyeline{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold2);font-weight:700}.qrbox h1{font-family:var(--serif);font-size:34px;font-weight:400;margin:8px 0}.featurelist{display:grid;gap:11px;margin-top:16px}.feature{display:flex;align-items:center;gap:13px;padding:15px}.featureicon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:#f0e0b9;color:#765718;display:grid;place-items:center;font-size:19px}
    html,body{max-width:100%;overflow-x:hidden}.qrbox{grid-template-columns:minmax(0,1fr) 112px;gap:12px}.qrbox h1{font-size:30px;line-height:1}
    /* desktop operations */
    .desktop{background:#efe9df}.desktop .shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#1b1412;color:white;padding:28px 21px;display:flex;flex-direction:column}.side .brandcopy span{color:#ae9f91}.side nav{display:grid;gap:7px;margin-top:42px}.side nav a{padding:12px 13px;border-radius:13px;font-size:12px;color:#c8beb5}.side nav a.active{background:#5e1b2c;color:white}.side nav a b{margin-right:11px}.profile{margin-top:auto;border-top:1px solid #3b302c;padding-top:18px;font-size:11px;color:#c8beb5}.desktopmain{padding:29px 34px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.topbar h1{font-family:var(--serif);font-size:35px;font-weight:400;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:4px 0 0}.avatar{width:40px;height:40px;border-radius:50%;background:var(--wine);color:white;display:grid;place-items:center;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:17px}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-family:var(--serif);font-size:29px;font-weight:400;margin-top:5px}.opgrid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:17px}.panel{padding:19px}.panel h2{font-family:var(--serif);font-weight:400;font-size:23px}.orderrow{padding:14px 0;border-top:1px solid var(--line)}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#f3e7c9;color:#795b19}.badge.green{background:#e1eee6;color:var(--green)}.badge.blue{background:#e4edf2;color:var(--blue)}.badge.red{background:#f4e1df;color:var(--red)}.tablegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tablecard{padding:17px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}.tablecard h3{font-family:var(--serif);font-size:22px;font-weight:400;margin:0}.tablecard.busy{border-color:#caa85e}.bigform{max-width:470px;margin:70px auto}.bigform .logo{text-align:center;margin-bottom:25px}.bigform .logo .brandmark{margin:auto;width:60px;height:60px;font-size:31px}.field{display:grid;gap:6px;margin-top:13px}.field label{font-size:11px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:14px;background:white;min-height:47px;padding:12px;font:inherit;font-size:12px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px}.payment{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.admincards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.admincard{padding:20px;min-height:190px}.admincard .featureicon{margin-bottom:28px}.admincard h2{font-family:var(--serif);font-weight:400;font-size:23px;margin-bottom:7px}.admincard p{font-size:11px;color:var(--muted);line-height:1.55}.loginbody{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.loginvisual{background:linear-gradient(150deg,#160e0d,#641a2b);padding:50px;color:white;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.loginvisual:after{content:"B";position:absolute;font-family:var(--serif);font-size:500px;color:rgba(230,204,138,.05);right:-80px;bottom:-135px}.loginvisual h1{font-family:var(--serif);font-size:58px;font-weight:400;max-width:540px;line-height:1.05}.loginvisual p{max-width:450px;opacity:.65;line-height:1.7}.loginform{display:flex;align-items:center;justify-content:center;padding:50px}.loginform form{width:390px}.loginform h2{font-family:var(--serif);font-size:36px;font-weight:400;margin-bottom:7px}
  </style>

<body><div id="app"></div>
<script>
const qs=new URLSearchParams(location.search);const screen=qs.get('screen')||'home';
const img={chicken:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/chicken-lollipops.jpg',burger:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/capitano-beef-burger.jpg',pasta:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/alla-olive.jpg',pizza:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/pizza-portofino.jpg',grill:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/rosemary-garlic-t-bone.jpg',curry:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/butter-chicken.jpg',dessert:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/malva-pudding.jpg',dragon:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/dragon-chicken.jpg',tikka:'https://storage.googleapis.com/menu-bukhara.firebasestorage.app/menu/malai-butter-tikka.jpg'};
const money=n=>`P ${n}.00`;const app=document.querySelector('#app');
function brand(){return `<div class="appbar"><div class="brand"><div class="brandmark">B</div><div class="brandcopy"><b>Bukhara</b><span>Restaurant · Gaborone</span></div></div><div class="iconbtn">☰</div></div>`}
function dock(active='menu'){return `<div class="navdock"><div class="${active==='menu'?'active':''}"><b>⌂</b>MENU</div><div class="${active==='orders'?'active':''}"><b>◫</b>ORDERS</div><div class="${active==='bill'?'active':''}"><b>♧</b>SERVICE</div><div><b>⋯</b>MORE</div></div>`}
function guest(content,active='menu'){app.innerHTML=`<div class="page">${brand()}${content}</div>${active==='checkout'||screen==='cart'?'':dock(active)}`}
function category(src,name,count){return `<div class="category"><img src="${src}"><div class="label"><b>${name}</b><span>${count} dishes →</span></div></div>`}
function dish(src,name,desc,price){return `<div class="dish card"><img src="${src}"><div class="info"><div class="between"><h3>${name}</h3><span class="price">${money(price)}</span></div><p>${desc}</p><span class="small" style="color:var(--wine);font-weight:700">View dish →</span></div></div>`}
function sidebar(active='orders',admin=false){let items=admin?[['overview','⌂','Overview'],['tables','▦','Tables & QR'],['menu','☷','Menu'],['media','◫','Media'],['staff','♙','Staff'],['reports','↗','Reports'],['settings','⚙','Settings']]:[['orders','◫','Live orders'],['tables','▦','Tables'],['scan','⌗','Open a table'],['history','◷','History']];return `<aside class="side"><div class="brand"><div class="brandmark">B</div><div class="brandcopy"><b>Bukhara</b><span>${admin?'Administration':'Service console'}</span></div></div><nav>${items.map(x=>`<a class="${active===x[0]?'active':''}"><b>${x[1]}</b>${x[2]}</a>`).join('')}</nav><div class="profile">${admin?'Lerato M. · Administrator':'Kabelo D. · Waiter'}<br><span style="opacity:.55">Evening service · Online</span></div></aside>`}
function desktop(content,active='orders',admin=false){app.innerHTML=`<div class="desktop"><div class="shell">${sidebar(active,admin)}<main class="desktopmain">${content}</main></div></div>`}
const views={
home(){guest(`<section class="hero"><span class="kicker">A culinary odyssey</span><h1>The world,<br>served beautifully.</h1><p>Discover flame-grilled favourites, fragrant curries and global classics—crafted in the heart of Gaborone.</p></section><div class="sectionhead"><h2>Good evening</h2><a>Our story</a></div><div class="qrbox"><div><span class="eyeline">Dining with us?</span><h1>Scan your table</h1><p class="small" style="opacity:.65;max-width:220px">Open the menu and order directly from your seat.</p></div><div class="qr"></div></div><div class="featurelist"><div class="card feature"><div class="featureicon">✦</div><div><b>Freshly prepared</b><div class="small muted">Every plate made to order</div></div></div><div class="card feature"><div class="featureicon">♧</div><div><b>Need assistance?</b><div class="small muted">Call your waiter from the menu</div></div></div></div>`)} ,
table(){guest(`<section class="hero" style="min-height:280px"><span class="kicker">Welcome to Bukhara</span><h1>Your table is ready.</h1><p>Table 08 · Browse, order, and follow your meal from this phone.</p><button class="btn gold" style="margin-top:20px;align-self:flex-start">Explore the menu →</button></section><div class="sectionhead"><h2>How it works</h2><span class="pill">Table 08</span></div><div class="featurelist"><div class="card feature"><div class="featureicon">01</div><div><b>Choose your dishes</b><div class="small muted">Browse the full menu and customise each item.</div></div></div><div class="card feature"><div class="featureicon">02</div><div><b>Send to the kitchen</b><div class="small muted">Review your basket and place the order.</div></div></div><div class="card feature"><div class="featureicon">03</div><div><b>Relax at your table</b><div class="small muted">Track progress or call your waiter anytime.</div></div></div></div>`)} ,
menu(){guest(`<section class="hero"><span class="kicker">Table 08 · Dinner menu</span><h1>What are you craving?</h1><p>Bold flavours, open-flame cooking and favourites from around the world.</p></section><div class="chips"><span class="pill active">All</span><span class="pill">Popular</span><span class="pill">Vegetarian</span><span class="pill">Spicy</span></div><div class="grid">${category(img.chicken,'Starters',24)}${category(img.burger,'Burgers',5)}${category(img.pasta,'Pasta',9)}${category(img.pizza,'Pizza',16)}${category(img.grill,'Char grills',12)}${category(img.curry,'Curries',28)}${category(img.dessert,'Desserts',8)}${category(img.dragon,'From the wok',13)}</div>`)} ,
category(){guest(`<div class="between" style="margin:3px 0 18px"><div><span class="kicker" style="color:var(--wine)">Dinner menu</span><h1 style="font:400 34px var(--serif);margin:7px 0 0">Starters</h1></div><span class="pill">24 dishes</span></div><div class="search">⌕ <span>Search starters</span></div><div class="chips"><span class="pill active">All</span><span class="pill">Chicken</span><span class="pill">Vegetarian</span><span class="pill">Seafood</span></div><div class="dishlist">${dish(img.chicken,'Chicken Lollipops','Crisp, spiced drumettes with our house dip.',98)}${dish(img.dragon,'Dragon Chicken','Crispy chicken in a bold soya, chilli and garlic glaze.',116)}${dish(img.tikka,'Malai Butter Tikka','Clay-oven chicken in creamy cashew marinade.',116)}${dish(img.curry,'Tandoori Chicken','Smoky, tender chicken roasted in the tandoor.',115)}${dish(img.pizza,'Chilli Paneer','Paneer tossed with garlic, chilli and peppers.',112)}</div>`)} ,
item(){guest(`<div class="detailphoto"><img src="${img.chicken}"><div class="floatback">←</div><div class="floating-heart">♡</div></div><div class="titleline"><h1>Chicken<br>Lollipops</h1><span class="price" style="font-size:17px">P 98.00</span></div><p class="copy">A lip-smacking favourite of tender chicken drumettes, expertly seasoned and fried until golden and crisp.</p><div class="notice">◇ Please tell your waiter directly about any food allergy.</div><div class="sectionhead"><h2>Make it yours</h2><span class="small muted">Optional</span></div><div class="options"><div class="option on"><span class="row"><i class="check">✓</i> House chilli sauce</span><span>+ P 8</span></div><div class="option"><span class="row"><i class="check"></i> Extra garlic dip</span><span>+ P 10</span></div></div><div class="sectionhead"><h2>Kitchen note</h2></div><div class="card pad small muted">For example: mild spice, sauce on the side…</div><div class="between" style="margin-top:18px"><div class="qty"><i>−</i><span>1</span><i>+</i></div><button class="btn gold">Add to order · P 106</button></div>`)} ,
